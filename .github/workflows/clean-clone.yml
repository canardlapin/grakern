name: Clean-clone release gate

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-source-court:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Prove a clean immutable-source checkout
        run: |
          test -z "$(git status --porcelain)"
          test -z "${SBT_OPTS:-}"
          test -z "${JAVA_OPTS:-}"
          grep -Eq 'val Graph4sRevision = "[0-9a-f]{40}"' build.sbt
          grep -Eq 'val GaleRevision = "[0-9a-f]{40}"' build.sbt
      - name: Run the complete supported-platform source court
        run: sbt scalafmtCheckAll compileAll testAll
      - name: Verify the court did not rewrite tracked sources
        run: git diff --exit-code
      - name: Fail closed before a dependency-blocked tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/check_release_readiness.py release/0.1.0-M1.properties
